<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loging</title>
    <style>
      * {
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
      }

      .container {
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgb(232, 232, 232);
        border-radius: 1px;
        flex-direction: column;
        width: 325px;
        height: 325px;
        padding: 70px;
        box-shadow: rgba(28, 28, 28, 0.08) 0px 2px 8px;
      }
      #main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background-color: #f8f8f8;
      }

      .container h1,
      label {
        font-size: 20px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
        text-transform: capitalize;
        margin-bottom: 25px;
      }
      .container h1 {
        color: #f16371;
      }
      .container #label {
        font-size: 11px;
      }
      .container input[type="submit"] {
        font-size: 13px;
        width: 65px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 600;
        margin-top: 20px;
        margin-left: 48px;
        text-transform: capitalize;
        padding: 1px;
        border: 1px solid black;
        border-radius: 2px;
        cursor: pointer;
      }
      .container input {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      form {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div id="main">
      <div class="container">
        <h1>sign in</h1>
        <form action="" target="_parent">
          <label for="email" id="label"> enter email </label>
          <input type="email" name="email" id="email" required />
          <br />
          <label for="password" id="label"> password </label>
          <input type="password" name="password" id="password" required />
          <label for="password" id="label"> confirm password </label>
          <input type="password" name="password" id="Compassword" required />
          <input type="submit" value="submit" class="submit" />
        </form>
      </div>
    </div>

    <script>
      let form = document.querySelector("form");
      let email = document.querySelector("#email");
      let password = document.querySelector("#password");
      let Compass = document.querySelector("#Compassword");
      let submit = document.querySelector(".submit");

      let userName = "zomato@gmail.com";
      let userpassword = "12345";
      submit.addEventListener("click",()=>{
        if (email.value!==userName) {
            alert("Email id is incorrect");
            confirm("try this email:zomato@gmail.com")
    
        }else if(password.value!==userpassword){
            alert("password is incorrect");
            confirm("try this password:12345")
        }else if (Compass.value!==userpassword) {
            alert("confirm password is incorrect"); 
        }else{
            form.action="index.html";
        }
        
      })
    </script>
  </body>
</html>
